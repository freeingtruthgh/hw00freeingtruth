[project]
name = "freeingtruth"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "freeingtruth", email = "freeingtruth13@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "manim>=0.19.2",
    "matplotlib>=3.10.8",
    "numpy>=2.4.1",
    "pandas>=3.0.0",
    "polars>=1.38.1",
    "scikit-learn>=1.8.0",
    "torch>=2.10.0",
]

[tool.maturin]
module-name = "freeingtruth._core"
python-packages = ["freeingtruth"]
python-source = "src"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.rs" }, { file = "Cargo.toml" }, { file = "Cargo.lock" }]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"
